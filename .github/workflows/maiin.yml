name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Organizar projeto
        run: |
          mkdir -p app/src/main/java/com/dlsreal
          mv AiRunner.kt EnhanceRenderer.kt GameDetector.kt MainActivity.kt OverlayService.kt app/src/main/java/com/dlsreal/
          mv AndroidManifest.xml app/src/main/
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DLSReal"
          include(":app")
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dlsreal"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.dlsreal"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 6
                  versionName = "4.1"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("org.tensorflow:tensorflow-lite:2.14.0")
              implementation("org.tensorflow:tensorflow-lite-gpu:2.14.0")
              implementation("org.tensorflow:tensorflow-lite-gpu-api:2.14.0")
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
